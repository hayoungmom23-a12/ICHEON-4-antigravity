<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이천 아이맵</title>
  <link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body>
  <div class="app-container">
    <!-- F1.1 히어로 블록 (진초록 그라데이션) [01-코스목록.png 기준] -->
    <div class="hero-wrapper">
      <header class="hero-banner">
        <span class="hero-code-badge">P01</span>
        <h1 class="hero-title">이천 아이맵</h1>
        <p class="hero-subtitle">아이와 이천, 출발 전에 주차장과 운영시간부터 확인하세요</p>
      </header>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content" id="main-content">
      <div id="status-message" style="color: var(--text-2); font-size: 13px;">데이터를 불러오는 중입니다...</div>
    </main>

    <!-- 하단 공통 푸터 영역 [F5.1~F5.3, F6.2] -->
    <div id="footer-container"></div>
  </div>

  <script src="assets/js/data.js?v=4"></script>
  <script src="assets/js/shared.js?v=4"></script>
  <script src="assets/js/course-list.js?v=4"></script>
  <script>
    loadAppData().then(({ coursesData, spotsData, restaurantsData }) => {
      const mainEl = document.getElementById('main-content');
      if (mainEl) {
        initCourseList(mainEl, coursesData);
      }
      const footerEl = document.getElementById('footer-container');
      if (footerEl) {
        footerEl.innerHTML = renderFooter(coursesData.asOf);
      }
    }).catch(err => {
      console.error('Data load error:', err);
    });
  </script>
</body>
</html>
