<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이천 아이맵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<!--
  이천 아이맵 · 구현 기준 정적 시안 (2026-09-18)
  ─────────────────────────────────────────────────────────
  이 파일이 디자인 기준입니다. design-prompt.md 4·5절보다 이 파일이 우선입니다.
  프레임워크 없음 / 빌드 없음. 브라우저로 바로 열립니다.
  텍스트 데이터는 courses.js 한 파일에만 있습니다 (여기서 문구를 고치지 마세요).
  네이버지도 키: 아래 NAVER_MAP_CLIENT_ID 에 넣으면 지도가 켜지고, 비어 있으면 자리 상자가 보입니다.
-->
<style>
:root{
  --bg:#FAF7F0;        /* 페이지 바탕 (크림) */
  --card:#FFFFFF;
  --border:#E6E0D4;
  --divider:#EEEAE2;
  --photo:#F1EDE4;
  --text:#1F2933;
  --text-2:#5C6470;
  --text-3:#8B8374;
  --heading:#111827;
  --accent:#0F6E56;
  --accent-bg:#E1F5EE;
  --accent-bg-2:#D2EFE3;
  --accent-hover:#085041;
  --warn:#B45309;
  --track-make-bg:#FAEEDA; --track-make:#633806;
  --track-out-bg:#EAF3DE;  --track-out:#27500A;
  --track-story-bg:#EEEDFE; --track-story:#3C3489;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty}
a{color:var(--accent)}
a:hover{color:var(--accent-hover)}
button{font-family:inherit}
img{display:block}

.page{max-width:640px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:24px}
.screen{display:flex;flex-direction:column;gap:24px}
.screen.detail{gap:22px}
.sub{font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:.02em}

/* ── 히어로: 사진 + 검정 그라데이션 오버레이 ───────────────── */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:240px;display:flex;align-items:flex-end;background:#2F4A44}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.68) 100%)}
.hero-txt{position:relative;z-index:1;padding:24px 20px 52px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hero-txt h1{margin:0;font-size:28px;font-weight:700;color:#fff;line-height:1.25;letter-spacing:-.01em}
.hero-txt p{margin:0;font-size:15px;color:#fff;line-height:1.5;max-width:30em}

/* ── 코스 요약 목록 ─────────────────────────────────────── */
.overview{display:flex;flex-direction:column;gap:6px}
.ov-row{display:flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;color:var(--text)}
.ov-row:not(:last-child){border-bottom:1px solid var(--divider)}
.ov-row:hover{color:var(--accent)}
.ov-name{font-size:15px;font-weight:700;flex:1;min-width:0}
.ov-region{font-size:12px;color:var(--text-2);flex-shrink:0}

/* ── 칩 ────────────────────────────────────────────────── */
.chips-wrap{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-size:14px;font-weight:400;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:700}
.track{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;flex-shrink:0}
.ov-row .track{width:84px;padding:0}
.track.make{background:var(--track-make-bg);color:var(--track-make)}
.track.out{background:var(--track-out-bg);color:var(--track-out)}
.track.story{background:var(--track-story-bg);color:var(--track-story)}

/* ── 코스 카드 ──────────────────────────────────────────── */
.cards{display:flex;flex-direction:column;gap:12px}
.cards-wrap{display:flex;flex-direction:column;gap:12px}
.ccard{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text);cursor:pointer;min-width:0}
.ccard:hover{border-color:var(--accent);color:var(--text)}
.ccard-in{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ccard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard-mid{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ccard-name{font-size:18px;font-weight:700;color:var(--heading);line-height:1.3}
.tag-rain{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--border);color:var(--text-2);font-size:11px}
.ccard-line{font-size:13px;color:var(--text-2)}

/* ── 지도 ──────────────────────────────────────────────── */
.map-wrap{display:flex;flex-direction:column;gap:12px}
#naver-map{height:240px;border-radius:12px;overflow:hidden;background:var(--photo)}
.map-ph{min-height:240px;border-radius:12px;border:1px dashed #D9D1C1;background:var(--photo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:13px;text-align:center;padding:16px}
.map-pins{display:flex;gap:14px}

/* ── 바깥 링크 타일 ─────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:10px 14px;background:var(--accent);border:1px solid var(--accent);border-radius:12px;text-decoration:none;color:#fff}
.tile:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.tile b{font-size:14px;font-weight:700}
.tile span{font-size:12px;color:var(--accent-bg-2)}

/* ── 코스 상세 ──────────────────────────────────────────── */
.back{display:inline-flex;align-items:center;gap:4px;height:44px;font-size:14px;color:var(--accent);text-decoration:none;align-self:flex-start}
.chead{display:flex;flex-direction:column;gap:8px}
.chead-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chead-region{font-size:12px;color:var(--text-2)}
.chead h2{margin:0;font-size:20px;font-weight:700;color:var(--heading);line-height:1.3}
.chead p{margin:0;font-size:14px;color:var(--text-2)}

.spot-block{display:flex;flex-direction:column;gap:22px}
.spot{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.spot-photo{position:relative;height:200px;background:var(--photo)}
.spot-photo img{width:100%;height:100%;object-fit:cover}
.spot-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.spot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.spot-name{font-size:18px;font-weight:700;color:var(--heading);line-height:1.3}
.badge-rec{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:6px;background:var(--track-make-bg);color:var(--track-make);font-size:12px;font-weight:700}
.toggle{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--text-2);flex-shrink:0}
.chev{transition:transform .2s}
.open .chev{transform:rotate(180deg)}

.band{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:0;background:var(--accent-bg);color:var(--accent);font-size:14px;font-weight:700;line-height:1.4;cursor:pointer}
.band:hover{background:var(--accent-bg-2)}
.band span{flex:1;min-width:0}

.jumps{display:flex;gap:6px;flex-wrap:nowrap;min-width:0}
.jump{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:40px;padding:0 10px;flex:1 1 0;min-width:0;white-space:nowrap;letter-spacing:-.02em;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
.jump:hover{border-color:var(--accent);color:var(--accent)}
.jump.on{border-color:var(--accent-bg);background:var(--accent-bg);color:var(--accent)}
.going{font-size:13px;color:var(--text-2)}

.spot-more{border-top:1px solid var(--border);padding:12px 16px 8px;display:flex;flex-direction:column}
.sect{display:flex;flex-direction:column;margin:0 -8px;padding:0 8px 4px;border-radius:8px;background:transparent;transition:background .5s}
.sect+.sect{margin-top:6px}
.sect.hl{background:var(--accent-bg)}
.sect>.sub{padding:6px 0 2px}
.sect+.sect>.sub{padding:12px 0 2px;border-top:1px solid var(--border)}

.row{display:flex;flex-direction:column}
.row:not(:last-child){border-bottom:1px solid var(--divider)}
.row-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;min-height:56px}
.thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--photo);display:flex;align-items:center;justify-content:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.park-info{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;flex-wrap:wrap;gap:2px;font-size:13px;line-height:1.5}
.park-info b{font-weight:700}
.arrow-line{display:flex;align-items:flex-start;gap:4px}
.arrow-line svg{flex-shrink:0;margin-top:3px}
.arrow-line.dim{color:var(--text-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;width:100px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;letter-spacing:-.02em;text-decoration:none;white-space:nowrap;flex-shrink:0;border:0;cursor:pointer}
.btn:hover{background:var(--accent-hover);color:#fff}
.btn-auto{margin-left:auto}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:2px;height:40px;width:80px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--accent);font-size:13px;font-weight:700;letter-spacing:-.02em;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-ghost:hover{border-color:var(--accent)}
.note-map{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-3);padding:0 0 10px}
.fac-info{flex:1 1 160px;min-width:0;display:flex;flex-direction:column}
.fac-name{font-size:15px;font-weight:700}
.fac-hours{font-size:13px;color:var(--text-2)}
.fac-hours .tel{white-space:nowrap}
.row-btns{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}
.more-box{display:flex;flex-direction:column;gap:8px;padding:0 0 12px}
.ph16{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--photo);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;text-align:center;padding:12px}
.more-txt{font-size:13px;color:var(--text-2);line-height:1.6}

.notice{display:flex;flex-direction:column;gap:8px;margin:10px 0 6px;padding:10px 12px;border-radius:10px;background:#FBF6EC;border:1px dashed #E3CFA3}
.notice-head{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.notice-head .thumb{width:44px;height:44px}
.notice-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.5}
.notice-txt .t1{display:flex;align-items:center;gap:6px}
.pill-warn{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--track-make);color:#fff;font-size:11px;font-weight:700}
.notice-sub{color:var(--text-2)}
.notice-body{display:flex;flex-direction:column;gap:8px}
.notice-body .right{display:flex;justify-content:flex-end}
.btn-sm{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.btn-sm:hover{border-color:var(--accent)}

.tip{display:flex;align-items:flex-start;gap:8px;padding:10px 0;font-size:13px;line-height:1.5}
.tip:not(:last-child){border-bottom:1px solid var(--divider)}
.tip-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;flex-shrink:0}

.sketch-box{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--photo);border:1px solid var(--border);margin:8px 0 0;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;text-align:center;padding:16px}
.sketch-box img{width:100%;height:100%;object-fit:contain}
.sketch-cap{font-size:13px;color:var(--text-2);line-height:1.6;padding:8px 0 10px}

.stay{display:flex;gap:12px;align-items:flex-start;padding:8px 0 12px}
.stay .thumb{width:104px;height:78px}
.stay-in{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.stay-in span{font-size:13px;line-height:1.6}
.stay-in .btn{align-self:flex-end;width:auto;min-width:84px;padding:0 12px}

.next{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--text-2)}

/* ── 식당 부록 ──────────────────────────────────────────── */
.food{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.food-note{font-size:13px;color:var(--text-2)}
.btn-lg{display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;text-decoration:none}
.btn-lg:hover{background:var(--accent-hover);color:#fff}
.food-label{display:flex;align-items:center;gap:6px;padding-top:2px}
.food-label .star{position:relative;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pill-food{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:#FFF3C4;color:#7A4E08;font-size:12px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.food-list{border-top:1px solid var(--divider);display:flex;flex-direction:column}
.food-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;min-height:56px}
.food-row:not(:last-child){border-bottom:1px solid var(--divider)}
.food-row-in{flex:1;min-width:0;display:flex;flex-direction:column}
.food-row-in b{font-size:15px;font-weight:700}
.food-row-in span{font-size:13px;color:var(--text-2)}
.food-row .btn{width:auto;padding:0 12px}

/* ── 하단 안내 ──────────────────────────────────────────── */
.footer{border-top:1px solid var(--border);padding-top:20px;display:flex;flex-direction:column;gap:8px;text-align:center;font-size:12px;color:var(--text-2);line-height:1.6}
.footer .f1{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.footer p{margin:0;max-width:440px;margin-left:auto;margin-right:auto}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="page">
  <div id="screen-list" class="screen"></div>
  <div id="screen-detail" class="screen detail hidden"></div>
  <div class="footer">
    <div class="f1">이천 아이맵 · 아이 동반 가족을 위한 출발 전 확인 카드</div>
    <p>운영 정보는 <span id="data-date">2026-09-04</span> 기준이며, 방문 전 각 시설의 공식 페이지에서 최신 정보를 확인해 주세요.</p>
    <p>'지도 기준' 표시가 있는 주차·진입 정보는 지도와 공개 자료를 바탕으로 정리한 것으로, 실제 현장과 다를 수 있습니다.</p>
  </div>
</div>

<script src="./courses.js"></script>
<script>
/* ─────────────────────────────────────────────────────────
   설정
   ───────────────────────────────────────────────────────── */
var NAVER_MAP_CLIENT_ID = '';   // ← 네이버 클라우드 플랫폼 Maps JS API 키를 넣으면 지도가 켜집니다
var DATA_DATE = '2026-09-04';

// 스팟 좌표 · ⚠ 대략값입니다. 네이버지도에서 확인해 교체하세요.
var COORDS = {
  seolbong: [37.26930, 127.42710],
  farmpark: [37.17520, 127.43830],
  wood:     [37.23660, 127.37180],
  dino:     [37.22080, 127.31900],
  ijin:     [37.24560, 127.35470]
};

var PHOTO = {
  lake:     { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/Lake_at_Seolbong_Park_4.jpg?width=480', credit: 'Wikimedia Commons' },
  farmpark: { src: 'https://farmpark.2000fmc.or.kr/campsite/images/img/og.jpg', credit: '이천시설관리공단' },
  farmmap:  { src: 'https://farmpark.2000fmc.or.kr/campsite/images/img/sight_2404.png', credit: '이천시설관리공단 안내지도' },
  ceramic:  { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/%EC%9D%B4%EC%B2%9C_%EB%8F%84%EC%9E%90%EA%B8%B0_%EC%B6%95%EC%A0%9C_(3).jpg?width=640', credit: '이천 도자기 축제 · Wikimedia Commons' },
  seolbong: { src: 'https://commons.wikimedia.org/wiki/Special:FilePath/%EC%84%A4%EB%B4%89%EA%B3%B5%EC%9B%90_%ED%98%B8%EC%88%98_(2).jpg?width=1200', credit: '설봉호 · Wikimedia Commons' }
};
var HERO_PHOTO = 'https://commons.wikimedia.org/wiki/Special:FilePath/%EC%84%A4%EB%B4%89%EA%B3%B5%EC%9B%90_%ED%98%B8%EC%88%98_(1).jpg?width=1600';

var TRACK = {
  make:  { label: '만들기',     cls: 'make' },
  out:   { label: '야외 활동',  cls: 'out' },
  story: { label: '이야기·문화', cls: 'story' }
};

/* ─────────────────────────────────────────────────────────
   아이콘
   ───────────────────────────────────────────────────────── */
var IC = {
  chevR: function (c, s) { return svg(s || 20, c || '#5C6470', '<path d="M9 6l6 6-6 6"/>'); },
  chevL: function (c, s) { return svg(s || 18, c || '#0F6E56', '<path d="M15 6l-6 6 6 6"/>'); },
  chevD: function (c, s) { return svg(s || 16, c || '#5C6470', '<path d="M6 9l6 6 6-6"/>'); },
  arrowR: function () { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'; },
  arrowD: function () { return svg(16, '#5C6470', '<path d="M12 5v14M6 13l6 6 6-6"/>'); },
  info: function () { return svg(14, '#8B8374', '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'); },
  pin: function () { return svg(24, '#0F6E56', '<path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.5"/>'); },
  cam: function (s) { return svg(s || 20, '#8B8374', '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', 1.8); },
  parkP: function () { return '<svg width="20" height="20" viewBox="0 0 24 24" style="flex-shrink:0"><rect x="3" y="3" width="18" height="18" rx="4" fill="#0F6E56"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">P</text></svg>'; },
  star: function () { return '<svg width="13" height="13" viewBox="0 0 24 24" fill="#C98A1B"><path d="M12 2l3.1 6.6 7.1.9-5.2 5 1.4 7.1L12 18.2 5.6 21.6 7 14.5l-5.2-5 7.1-.9z"/></svg>'; },
  pencil: function () { return svg(14, '#B45309', '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'); },
  foodStar: function () { return '<svg width="34" height="34" viewBox="0 0 24 24" style="position:absolute;inset:0"><path d="M12 2.6c.5 0 .9.3 1.1.7l2.1 4.4 4.8.6c1 .1 1.4 1.4.7 2.1l-3.5 3.3.9 4.8c.2 1-.9 1.8-1.8 1.3L12 17.5l-4.3 2.3c-.9.5-2-.3-1.8-1.3l.9-4.8-3.5-3.3c-.7-.7-.3-2 .7-2.1l4.8-.6 2.1-4.4c.2-.4.6-.7 1.1-.7z" fill="#FFD75E" stroke="#F0B429" stroke-width="1.2" stroke-linejoin="round"/><circle cx="9.6" cy="11.4" r=".9" fill="#7A4E08"/><circle cx="14.4" cy="11.4" r=".9" fill="#7A4E08"/><path d="M10.3 13.8c.9.9 2.5.9 3.4 0" stroke="#7A4E08" stroke-width="1" stroke-linecap="round" fill="none"/><circle cx="8.6" cy="13.2" r=".8" fill="#FFB3A7" opacity=".85"/><circle cx="15.4" cy="13.2" r=".8" fill="#FFB3A7" opacity=".85"/></svg>'; }
};
function svg(size, color, path, w) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color +
    '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
}

/* ─────────────────────────────────────────────────────────
   유틸
   ───────────────────────────────────────────────────────── */
var D = window.ICHEON_DATA || { SPOTS: {}, COURSES: [] };
var SPOTS = D.SPOTS, COURSES = D.COURSES;
var state = { filter: null, expanded: {}, more: {} };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function nmap(q) { return 'https://map.naver.com/p/search/' + encodeURIComponent(q); }
function nplace(r) { return r.placeId ? 'https://m.place.naver.com/restaurant/' + r.placeId + '/home' : nmap(r.q); }
function photoOf(key) { return key && PHOTO[key] ? PHOTO[key] : null; }
function thumb(key, size) {
  var p = photoOf(key), extra = size ? ' style="width:' + size[0] + 'px;height:' + size[1] + 'px"' : '';
  return '<div class="thumb"' + extra + '>' + IC.cam(size ? 20 : 20) +
    (p ? '<img src="' + esc(p.src) + '" alt="" title="' + esc(p.credit) + '" loading="lazy">' : '') + '</div>';
}
function trackChip(track, wide) {
  var t = TRACK[track];
  return '<span class="track ' + t.cls + '">' + esc(t.label) + '</span>';
}
/* 시설 운영시간 끝의 전화번호는 한 덩어리로 줄바꿈 */
function hoursHtml(hours) {
  var m = (hours || '').match(/^(.*?)\s*·\s*((?:문의\s*)?0\d{1,2}-\d{3,4}-\d{4})\s*$/);
  if (!m) return esc(hours);
  return esc(m[1]) + ' · <span class="tel">' + esc(m[2]) + '</span>';
}
function tipParts(t) {
  var m = t.match(/^(주차|진입|아이|운영|식사):\s*(.*)$/);
  return m ? { tag: m[1], text: m[2] } : { tag: null, text: t };
}
function facBtn(f) {
  if (!(f.official || f.phone || f.map)) return '';
  var label = f.btnLabel || (f.official ? '공식 페이지' : f.map ? '지도 열기' : '전화');
  var url = f.official && f.official.charAt(0) !== '[' ? f.official
    : f.map ? f.map
    : f.phone ? 'tel:' + f.phone.replace(/[^\d+]/g, '') : '#';
  return '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
}

/* ─────────────────────────────────────────────────────────
   화면 1 · 코스 목록
   ───────────────────────────────────────────────────────── */
function renderList() {
  var list = COURSES.filter(function (c) { return !state.filter || c.track === state.filter; });
  var label = state.filter ? TRACK[state.filter].label + ' 코스 ' + list.length + '개' : '취향별 추천 코스 ' + COURSES.length + '개';
  var h = '';

  h += '<div class="hero"><img src="' + esc(HERO_PHOTO) + '" alt="설봉호" title="설봉호 · Wikimedia Commons">' +
       '<div class="hero-txt"><h1>이천 아이맵</h1><p>아이와 이천, 출발 전에 주차장과 운영시간부터 확인하세요</p></div></div>';

  h += '<div class="overview"><div class="sub">코스 5개 한눈에</div>' +
    COURSES.map(function (c) {
      return '<a class="ov-row" href="#/course/' + c.id + '">' + trackChip(c.track) +
        '<span class="ov-name">' + esc(c.name) + '</span>' +
        '<span class="ov-region">' + esc(c.region) + '</span>' + IC.chevR('#8B8374', 16) + '</a>';
    }).join('') + '</div>';

  h += '<div class="chips-wrap"><div class="sub">아이 취향으로 고르기</div><div class="chips">' +
    Object.keys(TRACK).map(function (k) {
      return '<button class="chip" aria-pressed="' + (state.filter === k) + '" data-chip="' + k + '">' + esc(TRACK[k].label) + '</button>';
    }).join('') + '</div></div>';

  h += '<div class="cards-wrap"><div class="sub">' + esc(label) + '</div><div class="cards">' +
    list.map(function (c) {
      return '<a class="ccard" href="#/course/' + c.id + '"><div class="ccard-in">' +
        '<div class="ccard-top">' + trackChip(c.track) + '<span class="ov-region">' + esc(c.region) + '</span></div>' +
        '<div class="ccard-mid"><span class="ccard-name">' + esc(c.name) + '</span>' +
        (c.rain ? '<span class="tag-rain">비 오는 날 OK</span>' : '') + '</div>' +
        '<div class="ccard-line">' + esc(c.listLine) + '</div>' +
        '</div>' + IC.chevR('#5C6470', 20) + '</a>';
    }).join('') + '</div></div>';

  h += '<div class="map-wrap"><div class="sub">스팟 5곳 위치</div>' +
    (NAVER_MAP_CLIENT_ID
      ? '<div id="naver-map"></div>'
      : '<div class="map-ph"><div class="map-pins">' + [1, 2, 3, 4, 5].map(function () { return IC.pin(); }).join('') + '</div>' +
        '<div>이천 지도 자리 (네이버지도 임베드)</div>' +
        '<div style="font-size:11px">스크립트 상단 <code>NAVER_MAP_CLIENT_ID</code>에 키를 넣으면 지도가 켜집니다</div></div>') +
    '</div>';

  h += '<div class="tiles">' +
    '<a class="tile" href="https://blog.naver.com/PostList.naver?blogId=2000happy_&amp;from=postList&amp;categoryNo=92" target="_blank" rel="noopener"><b>이천시 공식 블로그</b><span>blog.naver.com · 여행 소식</span></a>' +
    '<a class="tile" href="https://www.icheon.go.kr/tour/main.do" target="_blank" rel="noopener"><b>이천관광 누리집</b><span>icheon.go.kr/tour · 공식 관광 정보</span></a>' +
    '</div>';

  document.getElementById('screen-list').innerHTML = h;
  if (NAVER_MAP_CLIENT_ID) initMap();
}

/* ─────────────────────────────────────────────────────────
   화면 2 · 코스 상세
   ───────────────────────────────────────────────────────── */
function renderDetail(course) {
  var h = '';
  h += '<a class="back" href="#/">' + IC.chevL() + '<span>코스 목록</span></a>';
  h += '<div class="chead"><div class="chead-row">' + trackChip(course.track) +
       '<span class="chead-region">' + esc(course.region) + '</span>' +
       (course.rain ? '<span class="tag-rain">비 오는 날 OK</span>' : '') + '</div>' +
       '<h2>' + esc(course.name) + '</h2><p>' + esc(course.intro) + '</p></div>';

  h += course.spots.map(function (ref, i) { return spotCard(SPOTS[ref.id], ref, i, course.spots.length); }).join('');

  var food = course.food;
  h += '<div class="food"><div class="sub">식당 부록</div>' +
    '<div class="food-note">이천 식당·카페는 18~19시에 닫는 곳이 많으니 저녁은 영업시간을 먼저 확인하세요</div>' +
    '<a class="btn-lg" href="' + esc(nmap(food.q)) + '" target="_blank" rel="noopener">근처 식당 네이버지도에서 보기</a>';
  if (food.list && food.list.length) {
    h += '<div class="food-label" title="직접 답사한 뒤 고른 식당입니다"><span class="star">' + IC.foodStar() + '</span><span class="pill-food">추천 식당</span></div>' +
      '<div class="food-list">' + food.list.map(function (r) {
        return '<div class="food-row"><div class="food-row-in"><b>' + esc(r.name) + '</b>' +
          (r.tip ? '<span>' + esc(r.tip) + '</span>' : '') + '</div>' +
          '<a class="btn" href="' + esc(nplace(r)) + '" target="_blank" rel="noopener">네이버플레이스</a></div>';
      }).join('') + '</div>';
  }
  h += '</div>';

  document.getElementById('screen-detail').innerHTML = h;
}

function spotCard(s, ref, i, total) {
  var open = !!state.expanded[i];
  var tips = (s.tips || []).map(tipParts);
  var p = photoOf(s.photo);
  var h = '<div class="spot-block"><div class="spot' + (open ? ' open' : '') + '" data-spot="' + i + '">';

  h += '<div class="spot-photo">' + (p
    ? '<img src="' + esc(p.src) + '" alt="' + esc(s.name) + '" title="' + esc(p.credit) + '" loading="lazy">'
    : '') + '</div>';

  h += '<div class="spot-body">' +
    '<div class="spot-head" data-toggle="' + i + '"><div class="ccard-mid"><span class="spot-name">' + esc(s.name) + '</span>' +
    (s.recommended ? '<span class="badge-rec">' + IC.star() + '추천</span>' : '') + '</div>' +
    '<div class="toggle"><span>' + (open ? '접기' : '펼치기') + '</span><span class="chev">' + IC.chevD() + '</span></div></div>';

  h += '<button class="band" data-jump="' + i + '|parking">' + IC.parkP() +
    '<span>' + esc(ref.parking) + '</span>' + IC.chevR('#0F6E56', 16) + '</button>';

  h += '<div class="jumps">' +
    '<button class="jump" data-jump="' + i + '|places">추천 장소 ' + s.facilities.length + '</button>' +
    (tips.length ? '<button class="jump on" data-jump="' + i + '|tips">방문 팁 ' + tips.length + '</button>' : '') +
    (s.sketch ? '<button class="jump" data-jump="' + i + '|sketch">약도 보기</button>' : '') +
    (s.stay ? '<button class="jump" data-jump="' + i + '|stay">숙박 안내</button>' : '') +
    '</div>';

  h += '<div class="going">이 코스에서 가는 곳: ' + esc(ref.going) + '</div></div>';

  if (open) {
    h += '<div class="spot-more">';

    /* 주차 안내 */
    h += '<div class="sect" data-sect="' + i + '|parking"><div class="sub">주차 안내</div>' +
      s.parkings.map(function (pk, j) {
        return '<div class="row"><div class="row-in">' + thumb(pk.photo) +
          '<div class="park-info"><b>' + esc(pk.name) + '</b>' +
          '<span class="arrow-line">' + IC.arrowR() + '<span>' + esc(pk.walkTo) + '</span></span>' +
          '<span class="arrow-line dim">' + IC.arrowR() + '<span>' + esc(pk.entry) + '</span></span></div>' +
          '<a class="btn btn-auto" href="' + esc(nmap(pk.q)) + '" target="_blank" rel="noopener">지도 열기</a></div>' +
          (pk.mapBased ? '<div class="note-map">' + IC.info() + '<span>지도 기준 정보 · 현장과 다를 수 있음</span></div>' : '') +
          '</div>';
      }).join('');
    if (s.parkingNotice) {
      var nk = i + '-pnotice', nOpen = !!state.more[nk];
      h += '<div class="notice"><div class="notice-head' + (nOpen ? ' open' : '') + '" data-more="' + nk + '">' +
        thumb(null, [44, 44]) +
        '<div class="notice-txt"><span class="t1"><span class="pill-warn">주의</span><b>' + esc(s.parkingNotice.name) + '</b></span>' +
        '<span class="notice-sub">' + esc(s.parkingNotice.text) + '</span></div>' +
        '<span class="chev">' + IC.chevD('#8B8374') + '</span></div>' +
        (nOpen ? '<div class="notice-body"><div class="ph16">후문 주차장 사진 (개발 단계에서 삽입)</div>' +
          '<div class="right"><a class="btn-sm" href="' + esc(nmap(s.parkingNotice.q)) + '" target="_blank" rel="noopener">지도 열기</a></div></div>' : '') +
        '</div>';
    }
    h += '</div>';

    /* 추천 장소 */
    h += '<div class="sect" data-sect="' + i + '|places"><div class="sub">추천 장소</div>' +
      s.facilities.map(function (f, j) {
        var mk = i + '-' + j, mo = !!state.more[mk];
        return '<div class="row"><div class="row-in">' + thumb(f.photo) +
          '<div class="fac-info"><span class="fac-name">' + esc(f.name) + '</span>' +
          '<span class="fac-hours">' + hoursHtml(f.hours) + '</span></div>' +
          '<div class="row-btns">' + facBtn(f) +
          (f.more ? '<button class="btn-ghost' + (mo ? ' open' : '') + '" data-more="' + mk + '"><span>' + (mo ? '접기' : '더보기') + '</span><span class="chev">' + IC.chevD('#0F6E56', 14) + '</span></button>' : '') +
          '</div></div>' +
          (f.more && mo ? '<div class="more-box"><div class="ph16">' + esc(f.name) + ' 소개 이미지 (개발 단계에서 삽입)</div>' +
            '<div class="more-txt">' + esc(f.more) + '</div></div>' : '') +
          '</div>';
      }).join('') + '</div>';

    /* 방문 팁 */
    if (tips.length) {
      h += '<div class="sect" data-sect="' + i + '|tips"><div class="sub">방문 팁</div>' +
        tips.map(function (t) {
          return '<div class="tip">' + (t.tag ? '<span class="tip-tag">' + esc(t.tag) + '</span>' : '') +
            '<span>' + esc(t.text) + '</span></div>';
        }).join('') + '</div>';
    }

    /* 약도 */
    if (s.sketch) {
      var sp = photoOf(s.sketch.photo);
      h += '<div class="sect" data-sect="' + i + '|sketch"><div class="sub">약도 · 스팟과 진입로</div>' +
        '<div class="sketch-box">' + (sp
          ? '<img src="' + esc(sp.src) + '" alt="약도" title="' + esc(sp.credit) + '" loading="lazy">'
          : '방문자 시점 약도 이미지 자리 (별도 제작 후 삽입)') + '</div>' +
        '<div class="sketch-cap">' + esc(s.sketch.caption) + '</div></div>';
    }

    /* 숙박 안내 */
    if (s.stay) {
      h += '<div class="sect" data-sect="' + i + '|stay"><div class="sub">숙박 안내</div>' +
        '<div class="stay">' + thumb(null, [104, 78]) +
        '<div class="stay-in"><span>' + esc(s.stay.text) + '</span>' +
        '<a class="btn" href="' + esc(s.stay.url) + '" target="_blank" rel="noopener">숙박 예약</a></div></div></div>';
    }

    h += '</div>';
  }

  h += '</div>';
  if (i < total - 1) h += '<div class="next">' + IC.arrowD() + '<span>다음 스팟</span></div>';
  return h + '</div>';
}

/* ─────────────────────────────────────────────────────────
   동작 · 라우팅
   ───────────────────────────────────────────────────────── */
document.addEventListener('click', function (e) {
  var chip = e.target.closest('[data-chip]');
  if (chip) { var k = chip.dataset.chip; state.filter = state.filter === k ? null : k; renderList(); return; }

  var jump = e.target.closest('[data-jump]');
  if (jump) {
    e.preventDefault(); e.stopPropagation();
    var parts = jump.dataset.jump.split('|'), i = parts[0], sec = parts[1];
    state.expanded[i] = true;
    renderCurrent();
    var el = document.querySelector('[data-sect="' + i + '|' + sec + '"]');
    if (el) {
      el.classList.add('hl');
      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' });
      setTimeout(function () { el.classList.remove('hl'); }, 1800);
    }
    return;
  }

  var more = e.target.closest('[data-more]');
  if (more) {
    e.preventDefault(); e.stopPropagation();
    var mk = more.dataset.more;
    state.more[mk] = !state.more[mk];
    renderCurrent();
    return;
  }

  var tg = e.target.closest('[data-toggle]');
  if (tg) { var n = tg.dataset.toggle; state.expanded[n] = !state.expanded[n]; renderCurrent(); return; }
});

function currentCourse() {
  var m = location.hash.match(/^#\/course\/([\w-]+)/);
  if (!m) return null;
  return COURSES.filter(function (c) { return c.id === m[1]; })[0] || null;
}
function renderCurrent() {
  var course = currentCourse();
  if (course) renderDetail(course); else renderList();
}
function route() {
  var course = currentCourse();
  document.getElementById('screen-list').classList.toggle('hidden', !!course);
  document.getElementById('screen-detail').classList.toggle('hidden', !course);
  if (course) { state.expanded = {}; state.more = {}; renderDetail(course); }
  else renderList();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.getElementById('data-date').textContent = DATA_DATE;
route();

/* ─────────────────────────────────────────────────────────
   네이버지도 · 키가 있을 때만 로드
   ───────────────────────────────────────────────────────── */
function initMap() {
  var box = document.getElementById('naver-map');
  if (!box) return;
  if (window.naver && window.naver.maps) return drawMap(box);
  if (document.getElementById('naver-map-sdk')) return;
  var sc = document.createElement('script');
  sc.id = 'naver-map-sdk';
  sc.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + NAVER_MAP_CLIENT_ID;
  sc.onload = function () { drawMap(document.getElementById('naver-map')); };
  document.head.appendChild(sc);
}
function drawMap(box) {
  if (!box || !window.naver) return;
  var ids = Object.keys(COORDS);
  var map = new naver.maps.Map(box, { center: new naver.maps.LatLng(37.2200, 127.3900), zoom: 10 });
  var bounds = new naver.maps.LatLngBounds();
  ids.forEach(function (id) {
    var c = COORDS[id], pos = new naver.maps.LatLng(c[0], c[1]);
    bounds.extend(pos);
    var mk = new naver.maps.Marker({ position: pos, map: map, title: (SPOTS[id] || {}).name || id });
    var iw = new naver.maps.InfoWindow({
      content: '<div style="padding:6px 10px;font-size:13px;font-family:Pretendard,sans-serif">' +
        ((SPOTS[id] || {}).name || id) + '</div>'
    });
    naver.maps.Event.addListener(mk, 'click', function () { iw.open(map, mk); });
  });
  map.fitBounds(bounds);
}
</script>
